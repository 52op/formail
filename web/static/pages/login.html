<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title id="pageTitle">Formail - 登录</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/assets/css/style.css" />
        <style>
            .tabs {
                display: flex;
                gap: var(--space-xs);
                margin-bottom: var(--space-lg);
                background: var(--color-gray-50);
                padding: 4px;
                border-radius: var(--radius-md);
            }

            .tab-btn {
                flex: 1;
                padding: var(--space-sm) var(--space-md);
                border-radius: var(--radius-sm);
                border: none;
                background: transparent;
                cursor: pointer;
                font-size: var(--text-sm);
                font-weight: 500;
                color: var(--color-gray-500);
                transition: all var(--transition-fast);
            }

            .tab-btn.active {
                background: var(--color-white);
                color: var(--color-primary);
                box-shadow: var(--shadow-sm);
            }

            .tab-pane {
                display: none;
            }

            .tab-pane.active {
                display: block;
                animation: fadeIn 0.2s ease;
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(4px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .captcha-wrap {
                margin: var(--space-md) 0;
                padding: var(--space-md);
                border: 1px dashed var(--color-gray-200);
                border-radius: var(--radius-md);
                background: var(--color-gray-50);
            }

            .captcha-image {
                margin: var(--space-sm) 0;
                display: flex;
                justify-content: center;
            }

            .captcha-image svg {
                border-radius: var(--radius-sm);
            }

            .inline-input-actions {
                display: flex;
                gap: var(--space-sm);
                align-items: center;
            }

            .inline-input-actions input {
                flex: 1;
                min-width: 0;
                width: auto;
            }

            .inline-input-actions .btn {
                white-space: nowrap;
                flex-shrink: 0;
            }

            .form-footer {
                margin-top: var(--space-lg);
                text-align: center;
                font-size: var(--text-sm);
                color: var(--color-gray-500);
            }

            .form-footer a {
                color: var(--color-primary);
                font-weight: 500;
            }

            .form-footer a:hover {
                text-decoration: underline;
            }

            .modal-overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0, 0, 0, 0.5);
                justify-content: center;
                align-items: center;
                z-index: 1000;
                animation: fadeIn 0.2s ease;
            }

            .modal-overlay.active {
                display: flex;
            }

            .modal-content {
                background: var(--color-white);
                border: 1px solid rgba(206, 223, 254, 0.5);
                border-radius: 8px;
                padding: 16px 12px;
                width: 90%;
                max-width: 360px;
                box-shadow: 0 0 20px rgba(100, 100, 100, 0.1);
                animation: slideUp 0.2s ease;
            }

            @keyframes slideUp {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .modal-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: var(--space-md);
            }

            .modal-header-actions {
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .modal-title {
                font-size: var(--text-lg);
                font-weight: 600;
                color: var(--color-gray-900);
            }

            .modal-close {
                background: none;
                border: none;
                cursor: pointer;
                padding: var(--space-xs);
                border-radius: var(--radius-sm);
                color: var(--color-gray-400);
                transition: all var(--transition-fast);
            }

            .modal-close:hover {
                background: var(--color-gray-100);
                color: var(--color-gray-600);
            }

            .modal-header-actions {
                display: flex;
                align-items: center;
                gap: 6px;
            }

            .modal-header-actions .btn-icon {
                padding: 8px;
                background: var(--color-gray-100);
                border: 1px solid var(--color-gray-200);
                border-radius: var(--radius-sm);
                color: var(--color-gray-600);
                cursor: pointer;
                transition: all var(--transition-fast);
            }

            .modal-header-actions .btn-icon:hover {
                background: var(--color-gray-200);
                color: var(--color-gray-700);
            }

            .modal-header-actions .btn-icon:active {
                transform: translateY(1px);
            }

            .captcha-hint-row {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 10px;
                font-size: 15px;
                color: #333;
                min-height: 36px;
                user-select: none;
            }

            .captcha-hint-text {
                flex: 1;
                font-weight: 400;
                padding-right: 5px;
            }

            .captcha-hint-image {
                height: 36px;
                width: auto;
                flex-shrink: 0;
                border-radius: 4px;
                display: none; /* 默认隐藏，仅点选模式显示 */
            }

            .captcha-hint-image.visible {
                display: block;
            }

            .captcha-canvas-container {
                position: relative;
                margin-top: 10px;
                background: #34383e;
                border-radius: 5px;
                overflow: hidden;
                -webkit-user-select: none;
                user-select: none;
            }

            #captchaCanvas {
                width: 100%;
                height: auto;
                display: block;
                margin: 0 auto;
                transition: transform 0.1s linear;
                position: relative;
                z-index: 2;
            }

            .captcha-dot {
                position: absolute;
                width: 24px;
                height: 24px;
                background: #fff;
                border: 2px solid #1890ff;
                border-radius: 50%;
                transform: translate(-50%, -50%);
                animation: pulse 0.3s ease;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 2px 6px rgba(24, 144, 255, 0.4);
                z-index: 10;
            }

            .captcha-dot-number {
                font-size: 12px;
                font-weight: bold;
                color: #1890ff;
            }

            /* ---- 底部滑块区域 ---- */
            #captchaSliderArea {
                margin-top: 10px;
                user-select: none;
            }

            .captcha-slider {
                position: relative;
                width: 100%;
                height: 44px;
                background: #e0e0e0;
                border-radius: 22px;
                overflow: hidden;
                user-select: none;
            }

            .captcha-slider-progress {
                position: absolute;
                left: 0;
                top: 0;
                height: 100%;
                background: #3e7cff;
                border-radius: 22px 0 0 22px;
                transition: width 0.06s linear;
            }

            .captcha-slider-text {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #999;
                font-size: 14px;
                font-weight: 400;
                letter-spacing: 1px;
                pointer-events: none;
                z-index: 1;
            }

            .captcha-slider-handle {
                position: absolute;
                left: 2px;
                top: 50%;
                transform: translateY(-50%);
                width: 40px;
                height: 40px;
                background: #fff;
                border-radius: 50%;
                cursor: grab;
                z-index: 2;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 2px 8px rgba(0,0,0,0.18);
                transition: box-shadow 0.2s, left 0.3s ease;
                color: #3e7cff;
            }

            .captcha-slider-handle:hover { box-shadow: 0 4px 12px rgba(62,124,255,0.35); }
            .captcha-slider-handle:active { cursor: grabbing; }

            .captcha-slider-handle svg {
                width: 18px;
                height: 18px;
                transition: transform 0.2s;
            }

            /* 拼图块 */
            .captcha-piece {
                position: absolute;
                z-index: 10;
                border-radius: 4px;
                pointer-events: none;
            }

            /* 旋转验证码圆形参考图 */
            .captcha-rotate-thumb {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 140px;
                height: 140px;
                border-radius: 50%;
                overflow: hidden;
                z-index: 5;
                border: 2px solid rgba(255, 255, 255, 0.6);
                box-shadow: 0 0 0 6px rgba(0, 0, 0, 0.25);
                pointer-events: none;
                transition: opacity 0.3s ease;
            }

            .captcha-rotate-thumb img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            @keyframes pulse {
                from {
                    transform: translate(-50%, -50%) scale(0);
                    opacity: 0;
                }
                to {
                    transform: translate(-50%, -50%) scale(1);
                    opacity: 1;
                }
            }

            #captchaThumb {
                margin-top: var(--space-sm);
                max-width: 100%;
                border-radius: var(--radius-sm);
            }

            .captcha-hint {
                font-size: var(--text-sm);
                color: var(--color-gray-500);
                margin-bottom: var(--space-sm);
                text-align: center;
            }

            .status-pending { color: var(--color-primary) !important; }
            .status-approved { color: var(--color-success, #16a34a) !important; }
            .status-rejected { color: var(--color-danger, #dc2626) !important; }
        </style>
    </head>
    <body>
        <div class="login-wrap">
            <div class="login-card">
                <div
                    style="
                        display: flex;
                        align-items: center;
                        gap: var(--space-sm);
                        margin-bottom: var(--space-md);
                    "
                >
                    <button
                        class="btn btn-link"
                        onclick="goBack()"
                        style="
                            padding: 0;
                            height: auto;
                            color: var(--color-gray-500);
                        "
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            style="width: 20px; height: 20px"
                        >
                            <path d="M15 19l-7-7 7-7" />
                        </svg>
                        返回首页
                    </button>
                    <div style="flex: 1"></div>
                </div>
                <div class="login-card-header" id="loginHeader">
                    <div
                        style="
                            display: flex;
                            align-items: center;
                            justify-content: center;
                            gap: var(--space-sm);
                            margin-bottom: var(--space-md);
                        "
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            style="
                                width: 32px;
                                height: 32px;
                                color: var(--color-primary);
                            "
                        >
                            <path
                                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"
                            />
                        </svg>
                        <span
                            id="siteName"
                            style="
                                font-size: var(--text-xl);
                                font-weight: 700;
                                color: var(--color-gray-900);
                            "
                            >Formail</span
                        >
                    </div>
                    <h1 class="login-card-title">欢迎回来</h1>
                    <p class="login-card-subtitle">
                        登录您的账号以管理表单和提交
                    </p>
                </div>

                <div class="tabs">
                    <button class="tab-btn active" data-tab="pane-password">
                        密码登录
                    </button>
                    <button class="tab-btn" data-tab="pane-code-login">
                        验证码登录
                    </button>
                    <button class="tab-btn" data-tab="pane-register">
                        用户注册
                    </button>
                </div>

                <section id="pane-password" class="tab-pane active">
                    <div class="form-group">
                        <label>用户名（邮箱）</label>
                        <input id="username" placeholder="you@example.com" />
                    </div>
                    <div class="form-group" style="margin-top: var(--space-md)">
                        <label>密码</label>
                        <input
                            id="password"
                            type="password"
                            placeholder="******"
                        />
                    </div>
                    <div class="actions">
                        <button
                            class="btn btn-primary"
                            style="flex: 1"
                            id="btnLogin"
                            type="button"
                        >
                            登录
                        </button>
                    </div>
                    <div class="form-footer">
                        <a href="#" onclick="showTab('pane-code-login')"
                            >使用验证码登录</a
                        >
                    </div>
                </section>

                <section id="pane-code-login" class="tab-pane">
                    <div class="form-group">
                        <label>用户名（邮箱）</label>
                        <input
                            id="code_login_email"
                            placeholder="you@example.com"
                        />
                    </div>
                    <div
                        class="inline-input-actions"
                        style="margin-top: var(--space-md)"
                    >
                        <input id="code_login_code" placeholder="邮箱验证码" />
                        <button
                            class="btn btn-secondary"
                            id="btnSendLoginCode"
                            type="button"
                        >
                            发送验证码
                        </button>
                    </div>
                    <div class="actions" style="margin-top: var(--space-md)">
                        <button
                            class="btn btn-primary"
                            style="flex: 1"
                            id="btnLoginCode"
                            type="button"
                        >
                            验证码登录
                        </button>
                    </div>
                    <div class="form-footer">
                        <a href="#" onclick="showTab('pane-password')"
                            >使用密码登录</a
                        >
                        <span style="margin: 0 var(--space-md)">|</span>
                        <a href="#" onclick="showTab('pane-register')"
                            >注册账号</a
                        >
                    </div>
                </section>

                <section id="pane-register" class="tab-pane">
                    <div class="form-group">
                        <label>邮箱（将作为用户名）</label>
                        <input id="reg_email" placeholder="new@example.com" />
                    </div>
                    <div class="form-group" style="margin-top: var(--space-md)">
                        <label>注册密码</label>
                        <input
                            id="reg_password"
                            type="password"
                            placeholder="至少6位"
                        />
                    </div>
                    <div class="form-group" style="margin-top: var(--space-md)">
                        <label>昵称</label>
                        <input id="reg_display_name" placeholder="可选" />
                    </div>
                    <div class="form-group" id="regReasonGroup" style="margin-top: var(--space-md); display: none;">
                        <label>注册申请 <span style="color: var(--color-danger);">*</span></label>
                        <textarea id="reg_reason" rows="3" placeholder="请简要说明：为什么注册 Formail、从哪里了解到 Formail 等"></textarea>
                    </div>
                    <div
                        class="inline-input-actions"
                        style="margin-top: var(--space-md)"
                    >
                        <input id="reg_code" placeholder="邮箱验证码" />
                        <button
                            class="btn btn-secondary"
                            id="btnSendRegCode"
                            type="button"
                        >
                            发送验证码
                        </button>
                    </div>
                    <div class="actions" style="margin-top: var(--space-md)">
                        <button
                            class="btn btn-success"
                            style="flex: 1"
                            id="btnRegister"
                            type="button"
                        >
                            注册
                        </button>
                    </div>
                    <div class="form-footer">
                        <a href="#" onclick="showTab('pane-password')"
                            >已有账号？立即登录</a
                        >
                    </div>
                </section>

                <section id="pane-pending" class="tab-pane">
                    <div style="text-align: center; padding: var(--space-md) 0;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 48px; height: 48px; color: var(--color-primary); margin-bottom: var(--space-md);">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>
                        <h2 style="font-size: var(--text-xl); font-weight: 600; margin-bottom: var(--space-sm);">注册成功</h2>
                        <p style="color: var(--color-gray-500); font-size: var(--text-sm);">您的账号正在等待管理员审核</p>
                    </div>
                    <div style="background: var(--color-gray-50); border-radius: var(--radius-md); padding: var(--space-md); margin-top: var(--space-md);">
                        <div style="display: flex; justify-content: space-between; margin-bottom: var(--space-sm);">
                            <span style="color: var(--color-gray-500); font-size: var(--text-sm);">邮箱</span>
                            <span id="pendingEmail" style="font-size: var(--text-sm); font-weight: 500;"></span>
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <span style="color: var(--color-gray-500); font-size: var(--text-sm);">状态</span>
                            <span id="pendingStatus" style="font-size: var(--text-sm); font-weight: 500; color: var(--color-primary);">
                                审核中...
                            </span>
                        </div>
                    </div>
                    <div class="actions" style="margin-top: var(--space-lg); gap: var(--space-sm);">
                        <button class="btn btn-secondary" style="flex: 1" id="btnRefreshStatus" type="button">
                            刷新状态
                        </button>
                        <button class="btn btn-primary" style="flex: 1; display: none;" id="btnGoLogin" type="button" onclick="showTab('pane-password')">
                            去登录
                        </button>
                    </div>
                </section>
            </div>
        </div>

        <div id="captchaModal" class="modal-overlay">
            <div class="modal-content">
                <div class="modal-header">
                    <span class="modal-title">安全验证</span>
                    <div class="modal-header-actions">
                        <button class="btn-icon" id="captchaRefresh" title="刷新验证码">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 18px; height: 18px">
                                <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                            </svg>
                        </button>
                        <button class="modal-close" id="captchaClose">
                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                style="width: 20px; height: 20px"
                            >
                                <path d="M18 6L6 18M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="captcha-hint-row">
                    <span class="captcha-hint-text">请在下图依次点击</span>
                    <img
                        id="captchaThumb"
                        class="captcha-hint-image"
                        alt="提示字符"
                    />
                </div>
                <div class="captcha-canvas-container">
                    <img id="captchaCanvas" alt="验证码" />
                </div>
                <div id="captchaSliderArea" style="display:none;"></div>
                <input
                    type="text"
                    id="captchaAnswer"
                    placeholder="请输入验证码"
                    class="form-control"
                    style="display: none"
                />
            </div>
        </div>

        <script src="/assets/js/api.js"></script>
        <script src="/assets/js/login.js"></script>
        <script>
            function goBack() {
                window.location.href = "/";
            }

            function showTab(tabId) {
                document
                    .querySelectorAll(".tab-btn")
                    .forEach((btn) => btn.classList.remove("active"));
                document
                    .querySelectorAll(".tab-pane")
                    .forEach((pane) => pane.classList.remove("active"));
                document
                    .querySelector(`[data-tab="${tabId}"]`)
                    .classList.add("active");
                document.getElementById(tabId).classList.add("active");
            }

            async function loadSiteSettings() {
                try {
                    const response = await fetch("/api/site-settings");
                    if (response.ok) {
                        const data = await response.json();
                        if (data.data) {
                            const settings = data.data;

                            if (settings.site_title) {
                                document.getElementById(
                                    "pageTitle",
                                ).textContent = settings.site_title + " - 登录";
                                document.getElementById(
                                    "siteName",
                                ).textContent = settings.site_title;
                            }

                            if (settings.logo_url) {
                                const header =
                                    document.getElementById("loginHeader");
                                header.innerHTML = `
                                <div style="display: flex; align-items: center; justify-content: center; gap: var(--space-sm); margin-bottom: var(--space-md);">
                                    <img src="${settings.logo_url}" alt="Logo" style="height: 32px;" />
                                </div>
                                <h1 class="login-card-title">欢迎回来</h1>
                                <p class="login-card-subtitle">登录您的账号以管理表单和提交</p>
                            `;
                            }

                            if (settings.favicon_url) {
                                const favicon =
                                    document.querySelector('link[rel="icon"]');
                                if (favicon) {
                                    favicon.href = settings.favicon_url;
                                }
                            }

                            const reasonGroup = document.getElementById("regReasonGroup");
                            if (reasonGroup) {
                                reasonGroup.style.display =
                                    settings.register_default_status === 0 ? "" : "none";
                            }
                        }
                    }
                } catch (e) {
                    console.log("加载站点设置失败:", e);
                }
            }

            document.querySelectorAll(".tab-btn").forEach((btn) => {
                btn.addEventListener("click", () => showTab(btn.dataset.tab));
            });

            loadSiteSettings();
        </script>
    </body>
</html>

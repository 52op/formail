<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formail - 表单管理</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link id="favicon" rel="icon">
    <style>
        .theme-preview-container {
            border: 1px solid var(--color-gray-200);
            border-radius: var(--radius-lg);
            overflow: hidden;
            background: var(--color-gray-50);
        }
        .theme-preview-header {
            padding: var(--space-md);
            background: var(--color-gray-100);
            border-bottom: 1px solid var(--color-gray-200);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .theme-preview-header h4 {
            margin: 0;
            font-size: var(--text-sm);
            font-weight: 600;
            color: var(--color-gray-700);
        }
        .theme-preview {
            padding: var(--space-lg);
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .preview-card {
            background: white;
            border-radius: 20px;
            padding: 32px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(59, 130, 246, 0.15);
            max-width: 320px;
            width: 100%;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .preview-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.3);
        }
        .preview-icon svg {
            width: 32px;
            height: 32px;
            color: white;
        }
        .preview-card h3 {
            margin: 0 0 8px;
            font-size: var(--text-lg);
            font-weight: 700;
        }
        .preview-card p {
            margin: 0 0 20px;
            font-size: var(--text-sm);
            line-height: 1.5;
        }
        .preview-countdown {
            font-size: var(--text-xs);
            color: var(--color-gray-400);
            margin-bottom: 12px;
        }
        .preview-link {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 8px;
            color: white;
            text-decoration: none;
            font-size: var(--text-sm);
            font-weight: 500;
        }
    </style>
</head>
<body>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/layout.js"></script>
    <script>
        const themes = {
            blue: {
                name: '蓝色经典',
                bgGradient: 'linear-gradient(135deg, #EEF2FF 0%, #F5F7FB 100%)',
                iconGradient: 'linear-gradient(135deg, #3B82F6 0%, #2563EB 100%)',
                buttonGradient: 'linear-gradient(135deg, #3B82F6 0%, #2563EB 100%)',
                textColor: '#1F2937',
                descColor: '#6B7280',
                cardBg: 'white'
            },
            green: {
                name: '绿色清新',
                bgGradient: 'linear-gradient(135deg, #ECFDF5 0%, #D1FAE5 100%)',
                iconGradient: 'linear-gradient(135deg, #10B981 0%, #059669 100%)',
                buttonGradient: 'linear-gradient(135deg, #10B981 0%, #059669 100%)',
                textColor: '#1F2937',
                descColor: '#6B7280',
                cardBg: 'white'
            },
            purple: {
                name: '紫色优雅',
                bgGradient: 'linear-gradient(135deg, #FAF5FF 0%, #F3E8FF 100%)',
                iconGradient: 'linear-gradient(135deg, #8B5CF6 0%, #7C3AED 100%)',
                buttonGradient: 'linear-gradient(135deg, #8B5CF6 0%, #7C3AED 100%)',
                textColor: '#1F2937',
                descColor: '#6B7280',
                cardBg: 'white'
            },
            orange: {
                name: '橙色活力',
                bgGradient: 'linear-gradient(135deg, #FFF7ED 0%, #FFEDD5 100%)',
                iconGradient: 'linear-gradient(135deg, #F97316 0%, #EA580C 100%)',
                buttonGradient: 'linear-gradient(135deg, #F97316 0%, #EA580C 100%)',
                textColor: '#1F2937',
                descColor: '#6B7280',
                cardBg: 'white'
            },
            dark: {
                name: '深色简约',
                bgGradient: 'linear-gradient(135deg, #1F2937 0%, #111827 100%)',
                iconGradient: 'linear-gradient(135deg, #60A5FA 0%, #3B82F6 100%)',
                buttonGradient: 'linear-gradient(135deg, #3B82F6 0%, #2563EB 100%)',
                textColor: '#F9FAFB',
                descColor: '#D1D5DB',
                cardBg: '#374151'
            }
        };

        requireAuth();

        const formCache = [];
        const userMap = {};

        function v(id) {
            return document.getElementById(id).value;
        }

        function setv(id, val) {
            document.getElementById(id).value = val ?? "";
        }


    // ==================== 验证邮箱功能 ====================

    async function resendVerify(formId) {
        if (!confirm("确认重新发送验证邮件？")) return;
        try {
            const r = await API.request(`/api/forms/${formId}/resend-verify`, { method: "POST" });
            toast(`验证邮件已发送至 ${r.recipient}（渠道: ${r.channel_name}）`, false);
            loadForms();
        } catch (e) {
            toast("发送失败: " + e.message, true);
        }
    }
        async function initPage() {
            await renderLayout(
                "forms",
                "表单管理",
                `
  <section class="card">
    <div class="card-header">
      <h3 class="card-title">表单列表</h3>
      <div style="display:flex;gap:8px;align-items:center;">
        <div id="userFilterWrap" style="display:none;">
          <select id="userFilter" onchange="loadForms()" style="padding:6px 10px;border:1px solid var(--color-gray-300);border-radius:var(--radius-sm);font-size:var(--text-sm);">
            <option value="">全部用户</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="resetFormEditor(); scrollToEditor();">新增表单</button>
      </div>
    </div>
    <div style="overflow-x:auto;">
    <table>
      <thead><tr><th>ID</th><th id="thOwner" style="display:none;">所属用户</th><th>名称</th><th>接收邮箱</th><th>邮箱验证</th><th>提交地址</th><th>状态</th><th>操作</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    </div>
  </section>

  <section class="card" id="formEditorCard">
    <div class="card-header">
      <h3 class="card-title" id="formTitle">新建表单</h3>
      <button class="btn btn-secondary" onclick="resetFormEditor()">重置</button>
    </div>
    <input type="hidden" id="fid" />
    <div class="grid">
      <div class="form-group"><label>表单名称</label><input id="name" placeholder="例如：联系表单" /></div>
      <div class="form-group"><label>接收邮箱</label><input id="recipient_email" type="email" placeholder="recipient@example.com" /></div>
      <div class="form-group"><label>绑定邮件渠道</label><select id="channel_id"><option value="0">自动（按优先级选择）</option></select></div>
      <div class="form-group"><label>成功跳转 URL</label><input id="success_redirect" placeholder="可选，留空不跳转" /></div>
      <div class="form-group"><label>成功文案</label><input id="success_message" placeholder="留空则不显示成功页面，直接跳转" oninput="updateThemePreview()" /></div>
      <div class="form-group"><label>成功页面主题</label>
        <select id="success_theme" onchange="updateThemePreview()">
          <option value="blue">蓝色经典</option>
          <option value="green">绿色清新</option>
          <option value="purple">紫色优雅</option>
          <option value="orange">橙色活力</option>
          <option value="dark">深色简约</option>
        </select>
      </div>
      <div class="form-group"><label>允许的来源域名</label><input id="allowed_origins" placeholder="留空允许所有来源，多个域名用逗号分隔，支持通配符如 https://*.example.com" /></div>
      <div class="form-group"><label>蜜罐字段名</label><input id="honeypot_field" placeholder="留空禁用，建议使用 _gotcha" /></div>
      <div class="form-group"><label>是否启用</label><select id="active"><option value="true">启用</option><option value="false">禁用</option></select></div>
    </div>
    <div class="grid" style="margin-top: var(--space-md);">
      <div class="form-group"><label>邮件主题模板</label><input id="email_subject_template" value="新表单提交: {{form_name}}" /></div>
      <div class="form-group"><label>自动回复开关</label><select id="auto_reply_enabled"><option value="false">关闭</option><option value="true">开启</option></select></div>
      <div class="form-group"><label>自动回复标题</label><input id="auto_reply_subject" value="已收到你的提交：{{form_name}}" /></div>
    </div>
    <div class="form-group" style="margin-top: var(--space-md);"><label>邮件正文模板</label><textarea id="email_body_template">{{fields}}</textarea></div>
    <div class="form-group" style="margin-top: var(--space-md);"><label>自动回复正文</label><textarea id="auto_reply_body">感谢提交，我们已收到。</textarea></div>

    <div class="grid" style="margin-top: var(--space-md);">
      <div class="form-group"><label>Webhook URL</label><input id="webhook_url" placeholder="留空不推送，例如 https://example.com/webhook" /></div>
      <div class="form-group"><label>Webhook 密钥</label><input id="webhook_secret" placeholder="可选，用于签名验证" /></div>
    </div>

    <div style="margin-top: var(--space-lg);">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-md);">
        <label style="font-weight:600;">字段定义（可选，留空则不校验）</label>
        <button class="btn btn-secondary btn-sm" onclick="addFieldRow()">+ 添加字段</button>
      </div>
      <div id="fieldsEditor"></div>
      <input type="hidden" id="fields_schema" />
    </div>

    <div class="theme-preview-container" style="margin-top: var(--space-lg);">
      <div class="theme-preview-header">
        <h4>主题预览</h4>
        <span id="currentThemeName" class="muted" style="font-size: var(--text-xs);">蓝色经典</span>
      </div>
      <div class="theme-preview" id="themePreview">
        <div class="preview-card" id="previewCard">
          <div class="preview-icon" id="previewIcon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>
          <h3 id="previewTitle">提交成功</h3>
          <p id="previewMessage">感谢您的提交，我们会尽快与您联系！</p>
          <div class="preview-countdown">将在 <span>5</span> 秒后自动跳转...</div>
          <a href="#" class="preview-link" id="previewLink">立即跳转</a>
        </div>
      </div>
    </div>

    <div class="actions" style="margin-top: var(--space-lg);">
      <button class="btn btn-primary" id="saveBtn">保存表单</button>
      <button class="btn btn-secondary" onclick="resetFormEditor()">重置</button>
    </div>
  </section>

`,
            );

            document.getElementById("saveBtn").onclick = async () => {
                try {
                    const id = v("fid");
                    const p = formPayload();
                    if (!p.name.trim()) {
                        toast("请输入表单名称", true);
                        return;
                    }
                    if (!p.recipient_email.trim()) {
                        toast("请输入接收邮箱", true);
                        return;
                    }
                    if (id)
                        await API.request(`/api/forms/${id}`, {
                            method: "PUT",
                            body: JSON.stringify(p),
                        });
                    else
                        await API.request("/api/forms", {
                            method: "POST",
                            body: JSON.stringify(p),
                        });
                    toast(id ? "表单已更新" : "表单已创建", false);
                    resetFormEditor();
                    loadForms();
                } catch (e) {
                    toast(e.message, true);
                }
            };

            if (isAdmin()) {
                document.getElementById("thOwner").style.display = "";
                document.getElementById("userFilterWrap").style.display = "";
                loadUsers();
            }

            Promise.all([loadBindableChannels(), loadForms()]).then(() => {
                updateThemePreview();
            }).catch((e) => toast(e.message, true));
        }

        initPage();
    </script>

    <script>
        function formPayload() {
            return {
                name: v("name"),
                recipient_email: v("recipient_email"),
                channel_id: Number(v("channel_id") || 0),
                success_redirect: v("success_redirect"),
                success_message: v("success_message"),
                success_theme: v("success_theme"),
                allowed_origins: v("allowed_origins"),
                honeypot_field: v("honeypot_field"),
                email_subject_template: v("email_subject_template"),
                email_body_template: v("email_body_template"),
                auto_reply_enabled: v("auto_reply_enabled") === "true",
                auto_reply_subject: v("auto_reply_subject"),
                auto_reply_body: v("auto_reply_body"),
                webhook_url: v("webhook_url"),
                webhook_secret: v("webhook_secret"),
                fields_schema: collectFieldsSchema(),
                active: v("active") === "true",
            };
        }

        function addFieldRow(field) {
            const container = document.getElementById("fieldsEditor");
            const idx = container.children.length;
            const row = document.createElement("div");
            row.style.cssText = "display:flex;gap:8px;align-items:center;margin-bottom:8px;padding:8px;background:var(--color-gray-50);border-radius:var(--radius-md);flex-wrap:wrap;";
            row.innerHTML = `
                <input placeholder="字段名" value="${field?.name || ''}" data-key="name" style="flex:1;min-width:100px;padding:6px 8px;border:1px solid var(--color-gray-300);border-radius:var(--radius-sm);" />
                <input placeholder="标签" value="${field?.label || ''}" data-key="label" style="flex:1;min-width:100px;padding:6px 8px;border:1px solid var(--color-gray-300);border-radius:var(--radius-sm);" />
                <select data-key="type" style="padding:6px 8px;border:1px solid var(--color-gray-300);border-radius:var(--radius-sm);">
                    <option value="text" ${field?.type === 'text' ? 'selected' : ''}>文本</option>
                    <option value="email" ${field?.type === 'email' ? 'selected' : ''}>邮箱</option>
                    <option value="tel" ${field?.type === 'tel' ? 'selected' : ''}>电话</option>
                    <option value="number" ${field?.type === 'number' ? 'selected' : ''}>数字</option>
                    <option value="textarea" ${field?.type === 'textarea' ? 'selected' : ''}>多行文本</option>
                    <option value="url" ${field?.type === 'url' ? 'selected' : ''}>URL</option>
                </select>
                <label style="display:flex;align-items:center;gap:4px;font-size:var(--text-sm);white-space:nowrap;">
                    <input type="checkbox" data-key="required" ${field?.required ? 'checked' : ''} /> 必填
                </label>
                <button class="btn btn-danger btn-sm" onclick="this.parentElement.remove()">删除</button>
            `;
            container.appendChild(row);
        }

        function collectFieldsSchema() {
            const rows = document.getElementById("fieldsEditor").children;
            if (rows.length === 0) return "";
            const fields = [];
            for (const row of rows) {
                const name = row.querySelector('[data-key="name"]').value.trim();
                if (!name) continue;
                fields.push({
                    name,
                    label: row.querySelector('[data-key="label"]').value.trim(),
                    type: row.querySelector('[data-key="type"]').value,
                    required: row.querySelector('[data-key="required"]').checked,
                });
            }
            return fields.length > 0 ? JSON.stringify(fields) : "";
        }

        function renderFieldsSchema(json) {
            const container = document.getElementById("fieldsEditor");
            container.innerHTML = "";
            if (!json) return;
            try {
                const fields = JSON.parse(json);
                for (const f of fields) addFieldRow(f);
            } catch (e) {}
        }

        function updateThemePreview() {
            const theme = themes[v("success_theme")] || themes.blue;
            const message = v("success_message") || "感谢您的提交，我们会尽快与您联系！";
            const hasRedirect = v("success_redirect") !== "";

            document.getElementById('currentThemeName').innerText = theme.name;
            document.getElementById('themePreview').style.background = theme.bgGradient;
            document.getElementById('previewCard').style.background = theme.cardBg;
            document.getElementById('previewIcon').style.background = theme.iconGradient;
            document.getElementById('previewTitle').style.color = theme.textColor;
            document.getElementById('previewMessage').style.color = theme.descColor;
            document.getElementById('previewLink').style.background = theme.buttonGradient;
            document.getElementById('previewMessage').innerText = message;

            const countdown = document.querySelector('.preview-countdown');
            const link = document.getElementById('previewLink');

            if (hasRedirect) {
                countdown.style.display = 'block';
                link.style.display = 'inline-block';
            } else {
                countdown.style.display = 'none';
                link.style.display = 'none';
            }
        }

        function scrollToEditor() {
            const editorCard = document.getElementById('formEditorCard');
            if (editorCard) {
                editorCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        async function loadUsers() {
            try {
                const users = await API.request("/api/users");
                const sel = document.getElementById("userFilter");
                for (const u of users) {
                    userMap[u.id] = u.display_name || u.username;
                    const opt = document.createElement("option");
                    opt.value = u.id;
                    opt.textContent = `#${u.id} ${u.display_name || u.username}`;
                    sel.appendChild(opt);
                }
            } catch (e) {}
        }

        async function loadBindableChannels() {
            const rows = await API.request("/api/channels/bindable");
            const sel = document.getElementById("channel_id");
            const keep = sel.value || "0";
            sel.innerHTML =
                '<option value="0">自动（按优先级选择）</option>' +
                rows
                    .filter((x) => !!x.can_use)
                    .map(
                        (x) =>
                            `<option value="${x.id}">#${x.id} ${x.name} [${x.owner_scope}] P=${x.priority}</option>`,
                    )
                    .join("");
            sel.value = keep;
            if (!Array.from(sel.options).some((o) => o.value === keep)) {
                sel.value = "0";
            }
        }

        async function loadForms() {
            let url = "/api/forms";
            if (isAdmin()) {
                const uid = document.getElementById("userFilter")?.value;
                if (uid) url += "?user_id=" + uid;
            }
            const rows = await API.request(url);
            formCache.splice(0, formCache.length, ...rows);
            const adminView = isAdmin();
            document.getElementById("tbody").innerHTML = rows
                .map(
                    (x) => `
    <tr>
      <td>${x.id}</td>
      ${adminView ? `<td><span class="muted">#${x.owner_user_id}</span> ${userMap[x.owner_user_id] || ''}</td>` : ''}
      <td>${x.name}</td>
      <td>${x.recipient_email || "<span class='muted'>未设置</span>"}<br/><small class='muted'>渠道: ${x.channel_id || "自动"}</small></td>
      <td>${x.email_verified ? '<span class="badge badge-success">已验证</span>' : '<span class="badge badge-warning">待验证</span>'}</td>
      <td>
          <code style="background: var(--color-gray-100); padding: 4px 8px; border-radius: 4px; font-size: var(--text-xs);">${location.origin}/f/${x.token}</code>
          <div style="display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap;">
            <button class="btn btn-secondary btn-xs" onclick="copyText('${location.origin}/f/${x.token}')">复制链接</button>
            <button class="btn btn-secondary btn-xs" onclick="copyHTMLCode('${location.origin}/f/${x.token}')">HTML 代码</button>
            <button class="btn btn-secondary btn-xs" onclick="copyJSONCode('${location.origin}/f/${x.token}')">JSON 代码</button>
          </div>
        </td>
      <td>${x.active ? '<span class="badge badge-success">启用</span>' : '<span class="badge badge-danger">禁用</span>'}${x.webhook_url ? '<br/><span class="badge badge-info" style="margin-top:4px;">Webhook</span>' : ''}</td>
      <td class="actions">
        <button class="btn btn-primary btn-sm" onclick='editFormById(${x.id})'>编辑</button>
        ${!x.email_verified ? `<button class='btn btn-secondary btn-sm' onclick='resendVerify(${x.id})'>验证邮箱</button>` : ''}
        <button class="btn btn-danger btn-sm" onclick='delForm(${x.id})'>删除</button>
      </td>
    </tr>
  `,
                )
                .join("");
        }

        function editFormById(id) {
            const x = formCache.find((i) => i.id === id);
            if (!x) return;
            setv("fid", x.id);
            setv("name", x.name);
            setv("recipient_email", x.recipient_email);
            setv("channel_id", String(x.channel_id || 0));
            setv("success_redirect", x.success_redirect);
            setv("success_message", x.success_message);
            setv("success_theme", x.success_theme || "blue");
            setv("allowed_origins", x.allowed_origins);
            setv("honeypot_field", x.honeypot_field);
            setv("email_subject_template", x.email_subject_template);
            setv("email_body_template", x.email_body_template);
            setv("auto_reply_enabled", String(!!x.auto_reply_enabled));
            setv("auto_reply_subject", x.auto_reply_subject);
            setv("auto_reply_body", x.auto_reply_body);
            setv("webhook_url", x.webhook_url);
            setv("webhook_secret", x.webhook_secret);
            renderFieldsSchema(x.fields_schema);
            setv("active", String(!!x.active));
            document.getElementById("formTitle").innerText = `编辑表单 #${x.id}`;
            document.getElementById("saveBtn").innerText = "更新表单";
            updateThemePreview();
            scrollToEditor();
        }

        function resetFormEditor() {
            setv("fid", "");
            setv("name", "");
            setv("recipient_email", "");
            setv("channel_id", "0");
            setv("success_redirect", "");
            setv("success_message", "");
            setv("success_theme", "blue");
            setv("allowed_origins", "");
            setv("honeypot_field", "_gotcha");
            setv("email_subject_template", "新表单提交: {{form_name}}");
            setv("email_body_template", "{{fields}}");
            setv("auto_reply_enabled", "false");
            setv("auto_reply_subject", "已收到你的提交：{{form_name}}");
            setv("auto_reply_body", "感谢提交，我们已收到。");
            setv("webhook_url", "");
            setv("webhook_secret", "");
            document.getElementById("fieldsEditor").innerHTML = "";
            setv("active", "true");
            document.getElementById("formTitle").innerText = "新建表单";
            document.getElementById("saveBtn").innerText = "保存表单";
            loadBindableChannels();
            updateThemePreview();
        }

        async function delForm(id) {
            if (!confirm("确认删除该表单？此操作不可撤销。")) return;
            await API.request(`/api/forms/${id}`, { method: "DELETE" });
            toast("表单已删除", false);
            loadForms();
        }

        function copyText(t) {
            navigator.clipboard.writeText(t).then(() => toast("链接已复制", false));
        }

        function copyHTMLCode(url) {
            const code = `<form action="${url}" method="POST">
  <input name="email" type="email" required />
  <textarea name="message" required></textarea>
  <input type="text" name="_gotcha" style="display:none" />
  <button type="submit">提交</button>
</form>`;
            navigator.clipboard.writeText(code).then(() => toast("HTML 代码已复制", false));
        }

        function copyJSONCode(url) {
            const code = `fetch("${url}", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({
    name: "姓名",
    email: "email@example.com",
    message: "内容"
  })
});`;
            navigator.clipboard.writeText(code).then(() => toast("JSON 代码已复制", false));
        }
    </script>
</body>
</html>

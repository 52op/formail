<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formail - 账号设置</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/layout.js"></script>
    <script>
        requireAuth();

        async function initPage() {
            let appCfg = {};
            try {
                const r = await fetch('/api/app-config');
                if (r.ok) appCfg = ((await r.json()).data) || {};
            } catch {}

            const isSSOMode = appCfg.auth_mode === 'sso';
            const ssoUrl = appCfg.sso_url || '';

            const pwdSection = isSSOMode
                ? `<section class="card" style="text-align:center;padding:var(--space-xl)">
    <p class="muted" style="margin-bottom:var(--space-lg)">账号密码由认证中心统一管理，请前往 GoAuth 修改</p>
    <a href="${ssoUrl}/profile" target="_blank" rel="noopener noreferrer" class="btn btn-primary">前往 GoAuth 管理账号</a>
  </section>`
                : `<section class="card">
    <div class="card-header">
      <h3 class="card-title">修改密码</h3>
    </div>
    <div class="grid">
      <div class="form-group"><label>旧密码</label><input id="old_password" type="password" placeholder="请输入当前密码" /></div>
      <div class="form-group"><label>新密码（至少 6 位）</label><input id="new_password" type="password" placeholder="请输入新密码" /></div>
      <div class="form-group"><label>确认新密码</label><input id="confirm_password" type="password" placeholder="再次输入新密码" /></div>
    </div>
    <div class="actions" style="margin-top: var(--space-lg);">
      <button class="btn btn-primary" id="btn">提交修改</button>
    </div>
  </section>`;

            await renderLayout(
                "profile",
                "账号设置",
                `
  <section class="card">
    <div class="card-header">
      <h3 class="card-title">当前登录信息</h3>
    </div>
    <div id="me" style="display: flex; align-items: center; gap: var(--space-lg);">
      <div style="width: 80px; height: 80px; background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark)); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; font-weight: 700;">
        <span id="avatarInitial">?</span>
      </div>
      <div>
        <h4 style="margin: 0; font-size: var(--text-lg); font-weight: 600; color: var(--color-gray-900);" id="displayName">-</h4>
        <p class="muted" style="margin: 4px 0 0;" id="username">-</p>
        <p class="muted" style="margin: 0;" id="role">-</p>
      </div>
    </div>
  </section>

  ${pwdSection}
`,
            );

            if (!isSSOMode) {
                document.getElementById("btn").onclick = async () => {
                    try {
                        const oldPwd = document.getElementById("old_password").value;
                        const newPwd = document.getElementById("new_password").value;
                        const confirmPwd = document.getElementById("confirm_password").value;

                        if (!oldPwd) { toast("请输入旧密码", true); return; }
                        if (!newPwd) { toast("请输入新密码", true); return; }
                        if (newPwd.length < 6) { toast("新密码至少需要6位", true); return; }
                        if (newPwd !== confirmPwd) { toast("两次输入的密码不一致", true); return; }

                        await API.request("/api/auth/change-password", {
                            method: "POST",
                            body: JSON.stringify({ old_password: oldPwd, new_password: newPwd }),
                        });
                        toast("密码已修改，请重新登录", false);
                        API.clearToken();
                        setTimeout(() => (location.href = "/login"), 1500);
                    } catch (e) {
                        toast(e.message, true);
                    }
                };
            }

            loadMe().catch((e) => toast(e.message, true));
        }

        async function loadMe() {
            const me = await API.request("/api/auth/me");
            document.getElementById("displayName").innerText = me.display_name || me.username;
            document.getElementById("username").innerText = `用户名: ${me.username} (ID: ${me.user_id})`;
            document.getElementById("role").innerText = `角色: ${me.role === "admin" ? "管理员" : "普通用户"}`;
            document.getElementById("avatarInitial").innerText = (me.display_name || me.username).charAt(0).toUpperCase();
        }

        initPage();
    </script>
</body>
</html>

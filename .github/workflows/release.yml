name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ''
          - goos: linux
            goarch: arm64
            suffix: ''
          - goos: darwin
            goarch: amd64
            suffix: ''
          - goos: darwin
            goarch: arm64
            suffix: ''
          - goos: windows
            goarch: amd64
            suffix: '.exe'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'

      - name: Download dependencies
        env:
          GOTOOLCHAIN: local
        run: go mod download

      - name: Build standard
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
        run: |
          BINARY=formail${{ matrix.suffix }}
          go build -ldflags="-s -w" -o "${BINARY}" ./cmd/formail

          PLATFORM=formail-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -r "${PLATFORM}.zip" "${BINARY}" web/static/
          else
            tar czf "${PLATFORM}.tar.gz" "${BINARY}" web/static/
          fi

      - name: Build embed (single binary)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
        run: |
          BINARY=formail-embed${{ matrix.suffix }}
          go build -tags embed -ldflags="-s -w" -o "${BINARY}" ./cmd/formail

          PLATFORM=formail-embed-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "${PLATFORM}.zip" "${BINARY}"
          else
            tar czf "${PLATFORM}.tar.gz" "${BINARY}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: formail-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            formail-${{ matrix.goos }}-${{ matrix.goarch }}.*
            formail-embed-${{ matrix.goos }}-${{ matrix.goarch }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            echo "body=Initial release" >> "$GITHUB_OUTPUT"
          else
            LOG=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD")
            {
              echo "body<<EOF"
              echo "## Changes since ${PREV_TAG}"
              echo ""
              echo "$LOG"
              echo ""
              echo "---"
              echo "## 下载说明"
              echo ""
              echo "- **formail-{os}-{arch}**: 标准版，需配合 web/static 目录使用，可自定义前端"
              echo "- **formail-embed-{os}-{arch}**: 嵌入版，单文件运行，前端已内置，无需额外文件"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
          files: dist/*
          generate_release_notes: true
